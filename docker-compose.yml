# Docker keeps container logs forever by default, which fills a small disk. Keep at most 3 files of 10 MB per service.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    build: ./backend
    environment:
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:?Set IGDB_CLIENT_ID in a root .env file (see .env.example)}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET:?Set IGDB_CLIENT_SECRET in a root .env file (see .env.example)}
      # Optional: a Steam Web API key turns on the "Import from Steam" feature (leave empty to switch it off)
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      # The address visitors type to reach the site. Steam sends people back here after "Connect Steam", so it must be
      # the real public address once deployed (for example https://vault.example.com)
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      # Sign up and sign in are off by default: visitors get a library on this device with no account. "true" turns them on.
      ENABLE_ACCOUNTS: ${ENABLE_ACCOUNTS:-false}
      # Number of proxies in front of the API, so rate limits see the real visitor IP. nginx alone is 1 (the default);
      # set TRUST_PROXY_HOPS=2 in .env when Caddy sits in front of nginx
      TRUST_PROXY: ${TRUST_PROXY_HOPS:-1}
      # Browsers only keep Secure cookies over HTTPS (plus localhost); set to "true" once the site is served over HTTPS
      COOKIE_SECURE: "false"
    volumes:
      - backlog-data:/data
    logging: *default-logging
    # A ceiling, not a reservation: a runaway process is stopped before it can take the whole (small) server down
    mem_limit: 384m
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  export:
    build: ./export-service
    environment:
      # The export service asks the API for a user's library instead of opening the database file itself
      API_BASE_URL: http://api:4000
    depends_on:
      api:
        condition: service_healthy
    logging: *default-logging
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        # Shown on the privacy page (set both in .env before the site is public)
        VITE_DATA_COUNTRY: ${DATA_COUNTRY:-}
        VITE_CONTACT_EMAIL: ${CONTACT_EMAIL:-}
    ports:
      - "8080:80"
    depends_on:
      - api
      - export
    # Without this, "running" is taken to mean "ready", but nginx is still starting up for a moment after the
    # container starts, and anything that connects in that gap (a deploy check, CI) gets a connection reset.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging: *default-logging
    mem_limit: 64m
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  backlog-data:
