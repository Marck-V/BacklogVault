# The whole site as one container, built from the Dockerfile at the root: the Node API, which also serves the React
# app. Run with: docker compose --env-file backend/.env up -d --build, then open http://localhost:8080.
# Production (Railway) builds the same Dockerfile.

# Docker keeps container logs forever by default, which fills a small disk. Keep at most 3 files of 10 MB.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build:
      context: .
      args:
        # Shown on the privacy page (set both before the site is public)
        DATA_COUNTRY: ${DATA_COUNTRY:-}
        CONTACT_EMAIL: ${CONTACT_EMAIL:-}
    environment:
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:?Set IGDB_CLIENT_ID in a root .env file (see .env.example)}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET:?Set IGDB_CLIENT_SECRET in a root .env file (see .env.example)}
      # Optional: a Steam Web API key turns on "Connect Steam" (leave empty to switch it off)
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      # The address visitors type to reach the site; Steam sends people back here after "Connect Steam".
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      # Sign up and sign in are off by default: visitors get a library on this device with no account. "true" turns them on.
      ENABLE_ACCOUNTS: ${ENABLE_ACCOUNTS:-false}
      # Nothing sits in front of the app locally, so it must not trust X-Forwarded-For (a visitor could fake it).
      # On Railway this is 1: Railway's own proxy.
      TRUST_PROXY: ${TRUST_PROXY_HOPS:-0}
      # Browsers only keep Secure cookies over HTTPS (plus localhost); "true" on Railway, which serves HTTPS.
      COOKIE_SECURE: "false"
    ports:
      - "8080:4000"
    volumes:
      - backlog-data:/data
    logging: *default-logging
    # A ceiling, not a reservation: a runaway process is stopped before it can take the whole machine down
    mem_limit: 384m
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  backlog-data:
