services:
  api:
    build: ./backend
    environment:
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:?Set IGDB_CLIENT_ID in a root .env file (see .env.example)}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET:?Set IGDB_CLIENT_SECRET in a root .env file (see .env.example)}
      # Number of proxies in front of the API, so rate limits see the real visitor IP. nginx alone is 1 (the default);
      # set TRUST_PROXY_HOPS=2 in .env when Caddy sits in front of nginx
      TRUST_PROXY: ${TRUST_PROXY_HOPS:-1}
      # Browsers only keep Secure cookies over HTTPS (plus localhost); set to "true" once the site is served over HTTPS
      COOKIE_SECURE: "false"
    volumes:
      - backlog-data:/data
    restart: unless-stopped

  export:
    build: ./export-service
    environment:
      # The export service asks the API for a user's library instead of opening the database file itself
      API_BASE_URL: http://api:4000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api
      - export
    restart: unless-stopped

volumes:
  backlog-data:
