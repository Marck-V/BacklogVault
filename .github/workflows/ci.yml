name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push cancels an older run, except on main, where the older run may be half-way through a deploy.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  ts-report:
    name: TS report typecheck
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ts-report
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ts-report/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  docker-stack:
    name: Docker stack smoke test
    runs-on: ubuntu-24.04
    env:
      IGDB_CLIENT_ID: ci-placeholder
      IGDB_CLIENT_SECRET: ci-placeholder
      # Accounts are off by default (guests-only launch); the smoke test still checks the guest-to-account upgrade.
      ENABLE_ACCOUNTS: "true"
    steps:
      - uses: actions/checkout@v7
      - name: Build all images
        run: docker compose build
      - name: Start the stack and wait until it is healthy
        run: docker compose up -d --wait --wait-timeout 120
      - name: Smoke test through the Caddy entrypoint
        run: |
          set -e
          U=http://localhost:8080
          J='Content-Type: application/json'

          # "Running" is not the same as "accepting connections", so wait (up to 30 seconds) until Caddy and the API
          # both answer before testing anything.
          for i in $(seq 1 30); do
            if curl -fsS $U/api/health > /dev/null 2>&1; then break; fi
            sleep 1
          done

          curl -fsS $U/ | grep -q '<div id="root">'
          curl -fsS $U/lists/1 | grep -q '<div id="root">'
          curl -fsS $U/api/health

          # A visitor with no session sees nothing and cannot export
          test "$(curl -fsS $U/api/lists)" = '[]'
          test "$(curl -s -o /dev/null -w '%{http_code}' $U/api/library/export.csv)" = '401'

          # User A: first write creates a guest session; then read back through the CSV export
          LIST_ID=$(curl -fsS -c /tmp/a.jar -b /tmp/a.jar -X POST $U/api/lists -H "$J" -d '{"name":"CI"}' | jq .id)
          curl -fsS -c /tmp/a.jar -b /tmp/a.jar -X POST "$U/api/lists/$LIST_ID/games" -H "$J" -d '{"igdb_id":1,"name":"CI Game"}'
          curl -fsS -b /tmp/a.jar $U/api/library/export.csv | grep -q 'CI Game,Backlog,CI,'

          # User B is isolated from user A in both the API and the CSV export
          curl -fsS -c /tmp/b.jar -b /tmp/b.jar -X POST $U/api/lists -H "$J" -d '{"name":"Other"}'
          test "$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/b.jar $U/api/lists/$LIST_ID)" = '404'
          if curl -fsS -b /tmp/b.jar $U/api/library/export.csv | grep -q 'CI Game'; then
            echo "LEAK: user B can see user A's data in the CSV export"
            exit 1
          fi

          # Guest upgrades to an account in place and keeps the library
          curl -fsS -c /tmp/a.jar -b /tmp/a.jar -X POST $U/api/auth/register -H "$J" -d '{"email":"ci@example.com","password":"ci-password-123"}'
          curl -fsS -b /tmp/a.jar $U/api/library/export.csv | grep -q 'CI Game,Backlog,CI,'
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v

  # Only for pushes to main, and only after every check above has passed.
  publish:
    name: Build and publish images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, ts-report, docker-stack]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GitHub's container registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push the API and web images
        env:
          # Shown on the privacy page. Set them under Settings > Secrets and variables > Actions > Variables.
          DATA_COUNTRY: ${{ vars.DATA_COUNTRY }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: |
          set -euo pipefail
          REPO="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          SOURCE="org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"
          docker build --label "$SOURCE" -t "$REPO/backlogvault-api:$GITHUB_SHA" -t "$REPO/backlogvault-api:latest" ./backend
          docker build --label "$SOURCE" \
            --build-arg VITE_DATA_COUNTRY="$DATA_COUNTRY" --build-arg VITE_CONTACT_EMAIL="$CONTACT_EMAIL" \
            -t "$REPO/backlogvault-web:$GITHUB_SHA" -t "$REPO/backlogvault-web:latest" ./frontend
          for name in api web; do
            docker push --quiet "$REPO/backlogvault-$name:$GITHUB_SHA"
            docker push --quiet "$REPO/backlogvault-$name:latest"
          done

  # Switched off until the server exists: set the repository variable DEPLOY_HOST (and the rest, see deploy/README.md).
  deploy:
    name: Deploy to the server
    if: vars.DEPLOY_HOST != ''
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://${{ vars.SITE_ADDRESS }}
    # Never two deploys at once, and never cancel one half-way.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      TARGET: ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}
      SITE: ${{ vars.SITE_ADDRESS }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          # The server's own host key, recorded once by hand, so a machine pretending to be the server is refused.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host *\n  IdentityFile ~/.ssh/id_deploy\n  BatchMode yes\n' > ~/.ssh/config
      - name: Copy the deploy files
        run: |
          ssh "$TARGET" 'mkdir -p backlogvault'
          scp deploy/docker-compose.prod.yml deploy/deploy.sh deploy/backup.sh "$TARGET:backlogvault/"
      - name: Log the server in to the registry for this deploy
        # The token expires when this job ends, so nothing long-lived is left on the server. It goes over stdin, never
        # on a command line where other users of the server could see it.
        run: echo "${{ secrets.GITHUB_TOKEN }}" | ssh "$TARGET" "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
      - name: Deploy this commit
        run: ssh "$TARGET" "cd backlogvault && chmod +x deploy.sh backup.sh && ./deploy.sh 'ghcr.io/${GITHUB_REPOSITORY_OWNER,,}' '$GITHUB_SHA'"
      - name: Log the server out of the registry
        if: always()
        run: ssh "$TARGET" 'docker logout ghcr.io' || true
      - name: Check the live site from outside
        run: |
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors "https://$SITE/api/health"
          curl -fsS "https://$SITE/" | grep -q '<div id="root">'
