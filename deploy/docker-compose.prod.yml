# Production stack for the server. It runs images that CI already built and pushed to GitHub's container registry, so
# the server needs only this file, deploy.sh and a .env file: no source code, Node or build tools.
# deploy.sh sets IMAGE_REPO (ghcr.io/<owner>) and IMAGE_TAG (the commit being deployed).
# The local stack (../docker-compose.yml) builds from source instead; keep the two in step when settings change.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    image: ${IMAGE_REPO:?}/backlogvault-api:${IMAGE_TAG:?}
    environment:
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:?Set IGDB_CLIENT_ID in .env}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET:?Set IGDB_CLIENT_SECRET in .env}
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      # Steam sends people back here after "Connect Steam", and the site and the API share this one address.
      PUBLIC_URL: https://${SITE_ADDRESS:?Set SITE_ADDRESS in .env, for example backlogvault.duckdns.org}
      ENABLE_ACCOUNTS: ${ENABLE_ACCOUNTS:-false}
      # Caddy is the only proxy in front of the API.
      TRUST_PROXY: "1"
      # The site is served over HTTPS, so the session cookie is only ever sent over HTTPS.
      COOKIE_SECURE: "true"
    volumes:
      - backlog-data:/data
    logging: *default-logging
    mem_limit: 384m
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  web:
    image: ${IMAGE_REPO:?}/backlogvault-web:${IMAGE_TAG:?}
    environment:
      # The public name: Caddy gets and renews its HTTPS certificate for it and redirects plain HTTP to HTTPS.
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # Certificates. Losing them means asking Let's Encrypt again, which limits how often it will issue.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8081/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging: *default-logging
    mem_limit: 64m
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  backlog-data:
  caddy-data:
  caddy-config:
