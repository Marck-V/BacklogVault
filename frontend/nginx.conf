server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css text/javascript application/javascript application/json image/svg+xml text/plain;

  # The API adds its own security headers, so this location adds none here.
  location /api/ {
    # A backup file with thousands of games can be a couple of megabytes (the API caps it at 4 MB).
    client_max_body_size 5m;
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Hashed build files never change, so browsers may keep them for a year.
  # nginx only inherits add_header from the server level when a location sets none of its own,
  # so every static location includes the shared security headers itself.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # The page itself must be re-checked on every visit so a new deploy is picked up.
  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  # Single-page app: unknown paths (e.g. /lists/4) fall back to index.html so React Router can handle them
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
